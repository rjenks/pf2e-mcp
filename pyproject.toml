[project]
name = "pf2e-mcp"
version = "0.2.0"
description = "MCP server for Pathfinder 2nd Edition Remastered rules lookup and character building"
readme = "README.md"
authors = [
    { name = "Rob Jenks", email = "robert@housejenks.com" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
# NOTICE.md and the OFL cover content this package redistributes, not just
# the repo: the wheel ships sheet_assets.py, whose vendored Noto subsets are
# OFL-licensed, and OFL condition 2 wants the licence to travel with every
# copy of the font software.
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
keywords = ["mcp", "pathfinder", "pf2e", "ttrpg", "character-builder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    # No "License ::" classifier on purpose: metadata 2.4 carries the licence
    # as License-Expression (PEP 639), and PyPI rejects a distribution that
    # declares both.
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Role-Playing",
]
dependencies = [
    "httpx>=0.28.1",
    # Structural validation of the character and chronicle schemas. Present
    # anyway as an mcp dependency, declared here because this project now
    # imports it directly.
    "jsonschema>=4.18.0",
    "mcp[cli]>=2.0.0",
    "platformdirs>=4.0.0",
    "pydantic>=2.13.4",
    # Round-trip YAML for characters/<Name>.yaml. PyYAML would do the parsing,
    # but these files are edited by hand as well as by the server, and a plain
    # load/dump cycle silently discards every comment and reorders every key.
    "ruamel.yaml>=0.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/rjenks/pf2e-mcp"
Repository = "https://github.com/rjenks/pf2e-mcp"
Issues = "https://github.com/rjenks/pf2e-mcp/issues"

[project.scripts]
pf2e-mcp = "pf2e_mcp:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"
